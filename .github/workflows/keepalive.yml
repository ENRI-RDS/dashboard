name: Keep Render Alive
on:
  schedule:
    - cron: '*/13 5-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://enri-dashboard-api.onrender.com/api/health)
          echo "HTTP status: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::error::Ping failed with status $code"
            exit 1
          fi
