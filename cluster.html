<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="it">
<title>ENRI — Cluster</title>
<script src="js/api-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --retelit-blue:#043F75; --retelit-blue-75:#436A93; --retelit-blue-50:#819FB9; --retelit-blue-25:#C0CFDC;
    --retelit-sky:#41BBD9;  --retelit-teal:#1A7D99;   --retelit-mist:#ADCAD6;   --retelit-ice:#D3DEEA;
    --gray-50:#F7F8FA; --gray-100:#EEF1F5; --gray-200:#DFE4EB;
    --gray-300:#C4CDD8; --gray-400:#9AA5B4; --gray-500:#6B7685;
    --gray-700:#363D48; --gray-800:#22272E;
    --ok:#1E9E6A; --warn:#D08A1A; --err:#C0392B;
    --bg: var(--gray-50); --surface:#FFFFFF; --surface2: var(--retelit-ice);
    --border: var(--gray-200); --border2: var(--gray-300);
    --accent: var(--retelit-blue); --accent2: var(--retelit-teal);
    --text: var(--gray-700); --text2: var(--gray-500); --muted: var(--gray-500); --muted2: var(--gray-400);
    --font-display:"Raleway","Calibri",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-body:"Raleway","Calibri",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sh-sm: 0 2px 8px rgba(4,63,117,.08), 0 1px 4px rgba(4,63,117,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--bg); color:var(--text); min-height:100vh; }

  #authGuard{ position:fixed; inset:0; background:var(--bg); z-index:500; align-items:center; justify-content:center; }
  .guard-box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:36px 40px; text-align:center; color:var(--accent); max-width:340px; }
  .guard-box svg{ margin-bottom:12px; }
  .guard-box h2{ font-family:var(--font-display); font-size:18px; font-weight:700; margin-bottom:8px; color:var(--text); }
  .guard-box p{ font-size:13px; color:var(--text2); margin-bottom:18px; }
  .guard-box a{ display:inline-block; background:var(--accent); color:#fff; font-weight:600; font-size:13px; padding:9px 18px; border-radius:8px; text-decoration:none; }

  .topbar{ background:var(--retelit-blue); padding:10px 24px; display:flex; align-items:center; justify-content:space-between; }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .divider-v{ width:1px; height:20px; background:var(--retelit-blue-50); }
  .page-title{ font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--retelit-ice); text-transform:uppercase; }
  .topbar-right{ display:flex; gap:10px; }
  .topbar-back{ font-size:12px; color:var(--retelit-sky); font-weight:600; text-decoration:none; display:flex; align-items:center; gap:4px; padding:4px 10px; border-radius:8px; border:1px solid var(--retelit-sky); }
  .topbar-back:hover{ background:rgba(255,255,255,.06); }

  .main{ display:grid; grid-template-columns:260px 1fr; gap:20px; max-width:1400px; margin:0 auto; padding:24px; }

  .sidebar{ display:flex; flex-direction:column; gap:8px; }
  .sidebar-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-family:var(--font-display); padding:0 4px 4px; }
  .cl-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
  .cl-card:hover{ border-color:var(--retelit-blue-50); box-shadow:var(--sh-sm); }
  .cl-card.active{ border-color:var(--accent); background:var(--retelit-blue)0d; box-shadow:var(--sh-sm); }
  .cl-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .cl-card-title{ font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--text); }
  .cl-card-pct{ font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--accent); }
  .cl-card-track{ height:5px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .cl-card-fill{ height:100%; background:var(--accent); border-radius:3px; }
  .cl-card-meta{ font-size:11px; color:var(--muted); display:flex; gap:10px; }

  .detail{ display:flex; flex-direction:column; gap:18px; min-width:0; }

  .det-header{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 24px; }
  .det-title{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--text); letter-spacing:-.02em; margin-bottom:14px; }
  .det-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
  .det-stat{ background:var(--surface2); border-radius:8px; padding:10px 12px; }
  .det-stat-lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:3px; }
  .det-stat-val{ font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--accent); }

  .section{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 22px; }
  .section-title{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-family:var(--font-display); margin-bottom:14px; display:flex; align-items:center; gap:6px; }

  .lotti-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .lotto-chip{ border:1px solid var(--border2); border-radius:8px; padding:10px 12px; }
  .lotto-chip-id{ font-family:var(--font-display); font-size:15px; font-weight:800; color:var(--accent); margin-bottom:4px; }
  .lotto-chip-track{ height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; margin-bottom:4px; }
  .lotto-chip-fill{ height:100%; background:var(--accent2); border-radius:2px; }
  .lotto-chip-pct{ font-size:11px; color:var(--muted); font-family:var(--font-mono); }

  .imp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .imp-card{ border:1px solid var(--border2); border-radius:10px; padding:14px 16px; }
  .imp-name{ font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .imp-avatar{ width:28px; height:28px; border-radius:50%; background:var(--retelit-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .imp-fonte{ display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:5px; margin-bottom:10px; }
  .imp-fonte-reale{ background:var(--ok)1a; color:var(--ok); }
  .imp-fonte-pianif{ background:var(--warn)1a; color:var(--warn); }
  .imp-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--text2); margin-bottom:4px; }
  .imp-row b{ color:var(--text); font-family:var(--font-mono); }
  .imp-lotti{ margin-top:8px; display:flex; gap:5px; flex-wrap:wrap; }
  .imp-lotto-pill{ font-size:10.5px; font-family:var(--font-mono); font-weight:700; color:var(--accent); background:var(--retelit-ice); border-radius:5px; padding:2px 7px; }

  .cant-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .cant-table th{ text-align:left; font-family:var(--font-display); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--border2); white-space:nowrap; }
  .cant-table td{ padding:7px 8px; border-bottom:1px solid var(--border); }
  .prov-pill{ font-size:10.5px; font-weight:700; border:1px solid; border-radius:5px; padding:1px 7px; }
  .btn-registro{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--retelit-blue-25); background:var(--surface); border-radius:7px; padding:4px 9px; font-size:11px; color:var(--accent); font-weight:600; cursor:pointer; }
  .btn-registro:hover{ background:var(--retelit-blue-25); }
  .btn-registro svg{ width:12px; height:12px; }

  .chip{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:5px; color:#fff; }

  .empty{ text-align:center; color:var(--muted); padding:30px; font-size:13px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(28,28,46,.45); backdrop-filter:blur(4px); z-index:250; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
  .modal-overlay.open{ opacity:1; pointer-events:all; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px; width:640px; max-width:96vw; max-height:82vh; overflow-y:auto; transform:translateY(16px); transition:transform .2s; }
  .modal-overlay.open .modal{ transform:translateY(0); }
  .modal-title{ font-family:var(--font-display); font-size:16px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .modal-close{ cursor:pointer; color:var(--muted); font-size:22px; line-height:1; background:none; border:none; }
</style>

<body>

<div id="authGuard" style="display:none">
  <div class="guard-box">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <h2>Accesso richiesto</h2>
    <p>Devi effettuare l'accesso al portale per utilizzare questa pagina.</p>
    <a href="hub.html">Vai al portale</a>
  </div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <div class="page-title">Cluster</div>
    <div class="divider-v"></div>
    <span style="font-size:11px;color:var(--retelit-ice)">vista per cluster · lotti compresi e imprese</span>
  </div>
  <div class="topbar-right">
    <a href="scavi.html" class="topbar-back">Avanzamento Scavi</a>
    <a href="hub.html" class="topbar-back">← Hub</a>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-label" id="sidebarCount">Cluster — caricamento…</div>
    <div id="clusterList"></div>
  </div>

  <div class="detail" id="detail">
    <div class="empty">Caricamento dati…</div>
  </div>
</div>

<div class="modal-overlay" id="modalRegistroOverlay" onclick="closeModalRegistro(event)">
  <div class="modal">
    <div class="modal-title"><span id="modalRegistroTitle">Registro —</span><button class="modal-close" onclick="closeModalRegistro()">×</button></div>
    <div id="modalRegistroBody"></div>
  </div>
</div>

<script>
let CANTIERI_RAW = [];
let PERMESSI = {};
let CLUSTER_PERMESSI = {};
let LOTTI = [];
let _clusterAttivo = null;

const IMPRESE_PER_LOTTO = {
  '1A': 'Valtellina', '1B': 'Soleto', '2A': 'Sielte', '2B': 'Telebit',
  '1': 'Valtellina', '2': 'Sertori', '3': 'Valtellina', '4': 'Sielte',
  '5': 'Circet', '6': 'Sertori', '7': 'Valtellina', '8': 'Sielte',
};
const STATO_MAP = { non_avviato:'non-avviato', allestimento:'allestimento', in_corso:'in-corso', sospeso:'sospeso', completato:'completato' };
const STATO_LABEL = { 'non-avviato':'Non avviato', 'allestimento':'Allestimento', 'in-corso':'In Corso', 'sospeso':'In Sospeso', 'completato':'Completato' };
const STATO_COLOR = { 'non-avviato':'#8A91B4', 'allestimento':'#C08A14', 'in-corso':'#0B3182', 'sospeso':'#C23B22', 'completato':'#1F7A4E' };
const RIEPILOGO_URL = 'Riepilogo_progettazione.csv';
const PROV_PALETTE = ['#043F75','#1A7D99','#41BBD9','#D08A1A','#C0392B','#7A3DAA','#1E9E6A','#B5657A','#436A93','#8A91B4'];

function fmt(n){ return Math.round(n||0).toLocaleString('it-IT'); }
function apiBase(){ return (window.ENRI && window.ENRI.apiBase) || localStorage.getItem('enri_api_base') || ''; }
function provColor(p){ if(!p) return '#9AA5B4'; let h=0; for(const c of p) h=(h*31+c.charCodeAt(0))>>>0; return PROV_PALETTE[h%PROV_PALETTE.length]; }
function provPill(p){ if(!p) return '—'; const c=provColor(p); return `<span class="prov-pill" style="background:${c}1f;color:${c};border-color:${c}55">${p}</span>`; }
function clusterKey(c){ return String(c||'?').replace(/^[Cc]/,''); }

function _parseCsvLine(line, sep) {
  const res = []; let cur = '', inQ = false;
  for (const ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === sep && !inQ) { res.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  res.push(cur.trim());
  return res;
}

async function _loadPermessi() {
  try {
    const res = await fetch(RIEPILOGO_URL, { cache:'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n').map(l => l.replace(/\r/, ''));
    const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
    const headers = _parseCsvLine(lines[0], sep);
    const findC = (...names) => { for (const n of names) { const i = headers.findIndex(h => h.trim().toUpperCase() === n.toUpperCase()); if (i>=0) return i; } return -1; };
    const iL = findC('LOTTO'), iS = findC('STATO_AUTORIZZAZIONE','STATO_LEGENDA'), iLun = findC('LUNGHEZZA','LENGTH'),
          iCl = findC('CLUSTER'), iPr = findC('PROVINCIA'), iCom = findC('COMUNE');

    const aggMap={}, totMap={}, clMap={}, provMap={}, comMap={};
    const clusterAggMap={}, clusterTotMap={}, clusterLottiMap={};
    for (let i=1; i<lines.length; i++) {
      const cols = _parseCsvLine(lines[i], sep);
      const lottoRaw = cols[iL]?.trim().replace(/"/g,'');
      if (!lottoRaw) continue;
      const lotto = String(lottoRaw);
      const stato = (iS>=0 ? cols[iS]?.trim() : '') || 'IN ATTESA';
      const lunghRaw = (cols[iLun] || '0').trim();
      let lungh = 0;
      if (lunghRaw.includes(',') && !lunghRaw.includes('.')) lungh = parseFloat(lunghRaw.replace(',', '.')) || 0;
      else if (lunghRaw.includes(',')) lungh = parseFloat(lunghRaw.replace(/\./g,'').replace(',', '.')) || 0;
      else lungh = parseFloat(lunghRaw) || 0;
      if (lungh <= 0) continue;
      if (!aggMap[lotto]) { aggMap[lotto]={}; totMap[lotto]=0; clMap[lotto]={}; provMap[lotto]=new Set(); comMap[lotto]=new Set(); }
      if (stato !== 'NO COMPETENZA') { aggMap[lotto][stato] = (aggMap[lotto][stato]||0)+lungh; totMap[lotto]+=lungh; }
      const cl = iCl>=0 ? cols[iCl]?.trim().replace(/^[Cc]/,'') : '';
      if (cl) clMap[lotto][cl] = (clMap[lotto][cl]||0)+lungh;
      const pr = iPr>=0 ? cols[iPr]?.trim() : ''; if (pr) provMap[lotto].add(pr);
      const com = iCom>=0 ? cols[iCom]?.trim() : ''; if (com) comMap[lotto].add(com);
      if (cl && stato !== 'NO COMPETENZA') {
        if (!clusterAggMap[cl]) { clusterAggMap[cl]={}; clusterTotMap[cl]=0; clusterLottiMap[cl]=new Set(); }
        clusterAggMap[cl][stato] = (clusterAggMap[cl][stato]||0)+lungh;
        clusterTotMap[cl] += lungh;
        clusterLottiMap[cl].add(lotto);
      } else if (cl) {
        if (!clusterLottiMap[cl]) clusterLottiMap[cl] = new Set();
        clusterLottiMap[cl].add(lotto);
      }
    }
    CLUSTER_PERMESSI = {};
    Object.keys(clusterLottiMap).forEach(cl => {
      CLUSTER_PERMESSI[cl] = { statiMap: clusterAggMap[cl]||{}, totale: clusterTotMap[cl]||0, lotti: [...clusterLottiMap[cl]] };
    });
    PERMESSI = {};
    Object.keys(aggMap).forEach(lotto => {
      const clEntries = Object.entries(clMap[lotto]||{});
      const clusterPrevalente = clEntries.length>0 ? clEntries.sort((a,b)=>b[1]-a[1])[0][0] : '?';
      PERMESSI[lotto] = { statiMap: aggMap[lotto], totale: totMap[lotto], cluster: clusterPrevalente, province:[...(provMap[lotto]||[])], comuni:[...(comMap[lotto]||[])] };
    });
  } catch(e) { console.warn('[cluster] _loadPermessi:', e.message); PERMESSI={}; CLUSTER_PERMESSI={}; }
}

async function _loadCantieri() {
  try {
    const res = await fetch(apiBase() + '/api/cantieri', { cache:'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    CANTIERI_RAW = d.cantieri || [];

    const STATO_RANK = { 'non-avviato':0, 'allestimento':1, 'sospeso':2, 'in-corso':3, 'completato':4 };
    const byLotto = {};
    CANTIERI_RAW.forEach(r => {
      const lotto = String(r.lotto || '?');
      const cluster = clusterKey(r.cluster);
      const statoUI = STATO_MAP[r.stato_cantiere] || 'non-avviato';
      const mTot = r.metri_totali || 0;
      if (!byLotto[lotto]) byLotto[lotto] = { id:lotto, cl:cluster, metri:0, scavati:0, stato:statoUI, statoMetri:{} };
      byLotto[lotto].metri += mTot;
      byLotto[lotto].scavati += r.metri_scavati || 0;
      byLotto[lotto].statoMetri[statoUI] = (byLotto[lotto].statoMetri[statoUI]||0) + mTot;
      if (STATO_RANK[statoUI] < STATO_RANK[byLotto[lotto].stato]) byLotto[lotto].stato = statoUI;
    });
    const lottiConCantiere = new Set(Object.keys(byLotto));
    const tuttiLotti = new Set([...lottiConCantiere, ...Object.keys(PERMESSI)]);
    LOTTI = [...tuttiLotti].map(lotto => {
      const c = byLotto[lotto]; const p = PERMESSI[lotto];
      const metriTotaliLotto = p ? p.totale : (c ? c.metri : 0);
      const scavati = c ? c.scavati : 0;
      const cluster = p && p.cluster && p.cluster !== '?' ? String(p.cluster) : (c ? String(c.cl) : '?');
      return {
        cl: cluster, id: String(lotto), stato: c ? c.stato : 'non-avviato',
        pct: metriTotaliLotto>0 ? Math.round(scavati/metriTotaliLotto*100) : 0,
        metri: Math.round(metriTotaliLotto), haCantiere: lottiConCantiere.has(lotto),
      };
    });
  } catch(e) { console.warn('[cluster] _loadCantieri:', e.message); CANTIERI_RAW=[]; LOTTI=[]; }
}

// ── Aggregati per cluster: avanzamento scavi + imprese coinvolte ──
function _clusterScaviAgg(cl) {
  const agg = { metri:0, scavati:0 };
  CANTIERI_RAW.forEach(r => { if (clusterKey(r.cluster) === cl) { agg.metri += r.metri_totali||0; agg.scavati += r.metri_scavati||0; } });
  return agg;
}
function _clusterImprese(cl) {
  const map = {};
  CANTIERI_RAW.forEach(r => {
    if (clusterKey(r.cluster) !== cl) return;
    const imp = r.impresa || IMPRESE_PER_LOTTO[String(r.lotto)] || 'Non assegnata';
    if (!map[imp]) map[imp] = { lotti:new Set(), metriTot:0, metriScavati:0, reale:false, pianificata:false };
    map[imp].lotti.add(String(r.lotto));
    map[imp].metriTot += r.metri_totali||0;
    map[imp].metriScavati += r.metri_scavati||0;
    map[imp].reale = true; // cantiere realmente avviato, anche se l'impresa è dedotta da fallback
  });
  (CLUSTER_PERMESSI[cl]?.lotti || []).forEach(lotto => {
    const giaPresente = CANTIERI_RAW.some(r => String(r.lotto)===String(lotto) && clusterKey(r.cluster)===cl);
    if (giaPresente) return;
    const imp = IMPRESE_PER_LOTTO[String(lotto)] || 'Non assegnata';
    if (!map[imp]) map[imp] = { lotti:new Set(), metriTot:0, metriScavati:0, reale:false, pianificata:false };
    map[imp].lotti.add(String(lotto));
    map[imp].metriTot += PERMESSI[lotto]?.totale || 0;
    map[imp].pianificata = true; // nessun cantiere avviato su questo lotto, impresa dedotta da IMPRESE_PER_LOTTO
  });
  return map;
}
function _initials(name) { return name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

// ── Render ──
function _renderSidebar() {
  const keys = new Set([...Object.keys(CLUSTER_PERMESSI), ...CANTIERI_RAW.map(r=>clusterKey(r.cluster))]);
  const clusters = [...keys].filter(k=>k && k!=='?').sort((a,b)=> (parseInt(a)||0)-(parseInt(b)||0) || a.localeCompare(b));
  document.getElementById('sidebarCount').textContent = `Cluster (${clusters.length})`;
  const list = document.getElementById('clusterList');
  if (!clusters.length) { list.innerHTML = '<div class="empty">Nessun cluster trovato.</div>'; return; }
  list.innerHTML = clusters.map(cl => {
    const agg = _clusterScaviAgg(cl);
    const pct = agg.metri>0 ? Math.round(agg.scavati/agg.metri*100) : 0;
    const nLotti = CLUSTER_PERMESSI[cl]?.lotti.length || [...new Set(CANTIERI_RAW.filter(r=>clusterKey(r.cluster)===cl).map(r=>String(r.lotto)))].length;
    const nImprese = Object.keys(_clusterImprese(cl)).length;
    return `<div class="cl-card${cl===_clusterAttivo?' active':''}" onclick="selectCluster('${cl}')">
      <div class="cl-card-head"><span class="cl-card-title">Cluster ${cl}</span><span class="cl-card-pct">${pct}%</span></div>
      <div class="cl-card-track"><div class="cl-card-fill" style="width:${pct}%"></div></div>
      <div class="cl-card-meta"><span>${nLotti} lotti</span><span>${nImprese} imprese</span></div>
    </div>`;
  }).join('');
  if (!_clusterAttivo && clusters.length) selectCluster(clusters[0]);
}

function selectCluster(cl) {
  _clusterAttivo = cl;
  _renderSidebar();
  _renderDetail(cl);
}

function _renderDetail(cl) {
  const agg = _clusterScaviAgg(cl);
  const pctScavo = agg.metri>0 ? Math.round(agg.scavati/agg.metri*100) : 0;
  const metriPermessi = CLUSTER_PERMESSI[cl]?.totale || agg.metri;
  const lottiIds = CLUSTER_PERMESSI[cl]?.lotti?.length ? CLUSTER_PERMESSI[cl].lotti : [...new Set(CANTIERI_RAW.filter(r=>clusterKey(r.cluster)===cl).map(r=>String(r.lotto)))];
  const imprese = _clusterImprese(cl);
  const impreseKeys = Object.keys(imprese).sort();
  const cantieriCluster = CANTIERI_RAW.filter(r => clusterKey(r.cluster) === cl);

  const lottiHtml = lottiIds.length
    ? [...lottiIds].sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0) || String(a).localeCompare(String(b))).map(lid => {
        const l = LOTTI.find(x => String(x.id)===String(lid) && x.cl===cl) || LOTTI.find(x=>String(x.id)===String(lid));
        const pct = l ? l.pct : 0;
        return `<div class="lotto-chip">
          <div class="lotto-chip-id">Lotto ${lid}</div>
          <div class="lotto-chip-track"><div class="lotto-chip-fill" style="width:${pct}%"></div></div>
          <div class="lotto-chip-pct">${pct}% scavato${l?` · ${fmt(l.metri)} m`:''}</div>
        </div>`;
      }).join('')
    : '<div class="empty">Nessun lotto associato.</div>';

  const impreseHtml = impreseKeys.length
    ? impreseKeys.map(imp => {
        const d = imprese[imp];
        const pct = d.metriTot>0 ? Math.round(d.metriScavati/d.metriTot*100) : 0;
        const badge = d.reale
          ? `<span class="imp-fonte imp-fonte-reale">cantiere avviato</span>`
          : `<span class="imp-fonte imp-fonte-pianif">assegnazione pianificata</span>`;
        return `<div class="imp-card">
          <div class="imp-name"><span class="imp-avatar">${_initials(imp)}</span>${imp}</div>
          ${badge}
          <div class="imp-row"><span>Metri gestiti</span><b>${fmt(d.metriTot)} m</b></div>
          <div class="imp-row"><span>Scavati</span><b>${fmt(d.metriScavati)} m · ${pct}%</b></div>
          <div class="imp-lotti">${[...d.lotti].sort().map(l=>`<span class="imp-lotto-pill">Lotto ${l}</span>`).join('')}</div>
        </div>`;
      }).join('')
    : '<div class="empty">Nessuna impresa assegnata.</div>';

  const cantieriHtml = cantieriCluster.length ? `
    <div style="overflow-x:auto">
      <table class="cant-table">
        <thead><tr><th>Cod. Cantiere</th><th>Lotto</th><th>Prov.</th><th>Comune</th><th>Impresa</th><th>Stato</th><th style="text-align:right">M. Tot.</th><th style="text-align:right">M. Scavati</th><th style="text-align:center">Registro</th></tr></thead>
        <tbody>${cantieriCluster.map(r => {
          const statoUI = STATO_MAP[r.stato_cantiere] || 'non-avviato';
          return `<tr>
            <td style="font-family:var(--font-mono);font-weight:700;color:var(--accent)">${r.codice_cantiere||'—'}</td>
            <td style="font-family:var(--font-mono);font-weight:700;color:var(--accent)">${r.lotto??'—'}</td>
            <td>${provPill(r.provincia)}</td>
            <td style="color:var(--muted)">${r.comune||'—'}</td>
            <td style="color:var(--muted)">${r.impresa||IMPRESE_PER_LOTTO[String(r.lotto)]||'—'}</td>
            <td><span class="chip" style="background:${STATO_COLOR[statoUI]}">${STATO_LABEL[statoUI]}</span></td>
            <td style="text-align:right;font-family:var(--font-display);font-weight:700">${fmt(r.metri_totali)}</td>
            <td style="text-align:right;color:var(--muted)">${fmt(r.metri_scavati)}</td>
            <td style="text-align:center"><button class="btn-registro" onclick="openModalRegistro('${(r.cantiere_key||'').replace(/'/g,"\\'")}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>Registro</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : '<div class="empty">Nessun cantiere ancora avviato in questo cluster.</div>';

  document.getElementById('detail').innerHTML = `
    <div class="det-header">
      <div class="det-title">Cluster ${cl}</div>
      <div class="det-stats">
        <div class="det-stat"><div class="det-stat-lbl">Metri totali</div><div class="det-stat-val">${fmt(metriPermessi)} m</div></div>
        <div class="det-stat"><div class="det-stat-lbl">Scavati</div><div class="det-stat-val">${fmt(agg.scavati)} m</div></div>
        <div class="det-stat"><div class="det-stat-lbl">Avanzamento</div><div class="det-stat-val">${pctScavo}%</div></div>
        <div class="det-stat"><div class="det-stat-lbl">Lotti compresi</div><div class="det-stat-val">${lottiIds.length}</div></div>
        <div class="det-stat"><div class="det-stat-lbl">Imprese coinvolte</div><div class="det-stat-val">${impreseKeys.length}</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Lotti compresi in questo cluster</div>
      <div class="lotti-grid">${lottiHtml}</div>
    </div>

    <div class="section">
      <div class="section-title">Imprese coinvolte
        <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted2);font-size:11px;margin-left:6px">— verde: cantiere avviato · ambra: assegnazione pianificata, cantiere non ancora aperto</span>
      </div>
      <div class="imp-grid">${impreseHtml}</div>
    </div>

    <div class="section">
      <div class="section-title">Cantieri del cluster</div>
      ${cantieriHtml}
    </div>
  `;
}

// ── Modal Registro (riuso stesso endpoint di scavi.html) ──
async function openModalRegistro(cantiereKey) {
  const overlay = document.getElementById('modalRegistroOverlay');
  const titleEl = document.getElementById('modalRegistroTitle');
  const bodyEl = document.getElementById('modalRegistroBody');
  titleEl.textContent = 'Registro — ' + cantiereKey;
  bodyEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">Caricamento…</div>';
  overlay.classList.add('open');
  try {
    const res = await fetch(apiBase() + '/api/cantieri/' + encodeURIComponent(cantiereKey) + '/log', { cache:'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const log = d.log || [];
    bodyEl.innerHTML = log.length ? `
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr><th style="text-align:left;padding:4px 0;color:var(--muted)">Data</th><th style="text-align:left;color:var(--muted)">Stato</th><th style="text-align:right;color:var(--muted)">Metri</th></tr></thead>
        <tbody>${log.map(e => `<tr><td style="font-family:var(--font-mono);font-size:10px;padding:5px 0">${e.data||'—'}</td><td>${e.stato_cantiere||'—'}</td><td style="text-align:right;font-family:var(--font-mono)">${e.metri_realizzati!=null?fmt(e.metri_realizzati)+' m':'—'}</td></tr>`).join('')}</tbody>
      </table>` : '<div class="empty">Nessuna voce nel registro.</div>';
  } catch(e) {
    bodyEl.innerHTML = `<div style="text-align:center;color:var(--err);padding:20px">Errore nel caricamento del registro: ${e.message}</div>`;
  }
}
function closeModalRegistro(e) {
  if (e && e.target !== document.getElementById('modalRegistroOverlay')) return;
  document.getElementById('modalRegistroOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalRegistro(); });

async function _loadAndRenderAll() {
  await Promise.all([_loadPermessi(), _loadCantieri()]);
  _renderSidebar();
}

window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
window.addEventListener('DOMContentLoaded', () => {
  const u = localStorage.getItem('_enri_user');
  if (!u) { document.getElementById('authGuard').style.display='flex'; return; }
  _loadAndRenderAll();
});
</script>
</body>
</html>
