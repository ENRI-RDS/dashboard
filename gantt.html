<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENRI — Gantt Lotto 1A</title>
<script src="js/api-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --retelit-blue:#043F75;--retelit-blue-75:#436A93;--retelit-blue-50:#819FB9;--retelit-blue-25:#C0CFDC;
  --retelit-sky:#41BBD9;--retelit-teal:#1A7D99;--retelit-mist:#ADCAD6;--retelit-ice:#D3DEEA;
  --gray-50:#F7F8FA;--gray-100:#EEF1F5;--gray-200:#DFE4EB;--gray-300:#C4CDD8;
  --gray-400:#9AA5B4;--gray-500:#6B7685;--gray-700:#363D48;
  --font-display:"Raleway","Calibri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Raleway","Calibri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:var(--gray-50);--surface:#fff;--surface2:var(--retelit-ice);
  --border:var(--gray-200);--border2:var(--gray-300);
  --accent:var(--retelit-blue);--accent2:var(--retelit-teal);
  --text:var(--gray-700);--text2:var(--gray-500);--muted:var(--gray-500);--muted2:var(--gray-400);
  --ok:#1E9E6A;--ok-bg:#EBFAF3;--warn:#D08A1A;--warn-bg:#FEF7E7;--danger:#C0392B;--danger-bg:#FEECEB;
  --radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:20px;--radius-2xl:28px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(4,63,117,.06),0 1px 1px rgba(4,63,117,.04);
  --shadow-md:0 4px 12px rgba(4,63,117,.08),0 2px 4px rgba(4,63,117,.04);
  --shadow-lg:0 12px 32px rgba(4,63,117,.12),0 4px 12px rgba(4,63,117,.06);
  --shadow-focus:0 0 0 3px rgba(65,187,217,.35);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);
  --dur-fast:120ms;--dur-base:200ms;--dur-slow:360ms;
  --sh-sm:0 2px 8px rgba(4,63,117,.08),0 1px 4px rgba(4,63,117,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px;background:var(--retelit-blue);position:sticky;top:0;z-index:50;}
.topbar-left{display:flex;align-items:center;gap:16px;}
.logo{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
.divider-v{width:1px;height:20px;background:var(--retelit-blue-50);}
.page-title{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--retelit-ice);text-transform:uppercase;}
.topbar-back{font-size:12px;color:var(--retelit-sky);font-weight:600;text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;border:1px solid var(--retelit-sky);transition:background .15s;}
.topbar-back:hover{background:rgba(65,187,217,.1);}
.btn-sm{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:6px 14px;border-radius:6px;background:transparent;color:var(--muted);border:1px solid var(--border2);cursor:pointer;font-family:var(--font-body);font-weight:600;text-decoration:none;}
.main{max-width:100%;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:24px;}
.tables-row{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start;min-width:0;}
.tables-row>*{min-width:0;overflow:hidden;}
@media(max-width:1000px){.tables-row{grid-template-columns:1fr;}}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);}
.page-h1{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.025em;color:var(--text);line-height:1.2;}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.legend-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.legend-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;font-family:var(--font-mono);letter-spacing:.04em;}
.chip-2026{background:rgba(65,187,217,.12);color:#1A7D99;border:1px solid #ADCAD6;}
.chip-2027{background:rgba(30,158,106,.10);color:#1E9E6A;border:1px solid #bbf7d0;}
.chip-2028{background:rgba(4,63,117,.10);color:#043F75;border:1px solid #819FB9;}
.chip-overdue{background:rgba(4,63,117,.16);color:#043F75;border:1px solid #436A93;font-weight:700;}
.section-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden;}
.section-head{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);}
.section-icon{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.section-icon svg{width:18px;height:18px;}
.si-imprese{background:var(--retelit-ice);} .si-imprese svg{color:var(--retelit-blue);}
.si-contract{background:var(--ok-bg);} .si-contract svg{color:var(--ok);}
.section-head-text{flex:1;}
.section-tag{font-family:var(--font-mono);font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px;}
.section-title{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.section-badge{font-size:9px;font-weight:700;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
.badge-imprese{background:var(--retelit-ice);color:var(--retelit-blue);border:1px solid var(--retelit-mist);}
.badge-contract{background:var(--ok-bg);color:var(--ok);border:1px solid var(--retelit-mist);}
.table-wrap{overflow-x:auto;width:100%;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr.group-head th{padding:9px 14px 8px;font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--border2);white-space:nowrap;}
th.gh-base{color:var(--muted);text-align:center;}
th.gh-base.col-left{text-align:left;}
th.gh-permit{background:var(--retelit-ice);color:var(--retelit-blue);text-align:center;border-bottom:2px solid var(--retelit-mist);border-left:3px solid var(--retelit-blue);}
th.gh-permit + th.gh-permit{border-left:1px solid var(--retelit-mist);}
th.gh-scavi{color:var(--warn);text-align:center;border-bottom:2px solid var(--warn);border-left:3px solid var(--warn);}
th.gh-compl{color:var(--warn);text-align:center;border-bottom:2px solid var(--warn);}
thead tr.col-head th{padding:5px 14px 6px;font-family:var(--font-body);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
th.ch-base{color:transparent;}
th.ch-base.col-left{text-align:left;}
th.ch-permit{background:var(--retelit-ice);color:var(--retelit-teal);text-align:center;border-left:3px solid var(--retelit-blue);}
th.ch-scavi{color:var(--warn);text-align:center;border-left:3px solid var(--warn);}
th.ch-compl{background:var(--ok-bg);color:var(--ok);text-align:center;border-left:3px solid var(--ok);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(4,63,117,.025);}
tbody td{padding:10px 14px;text-align:center;color:var(--text2);font-size:12px;white-space:nowrap;vertical-align:middle;}
tbody td.col-left{text-align:left;font-weight:600;color:var(--text);}
tbody td.col-id{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);text-align:center;}
tbody td.col-avvio{border-left:3px solid var(--warn);}
tbody td.col-compl-first{border-left:none;}
tbody td.col-compl{}
tbody td.col-permit-first{border-left:3px solid var(--retelit-blue);}
tbody tr.group-row td{background:var(--surface2);font-family:var(--font-mono);font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);padding:6px 14px;text-align:left;border-top:1px solid var(--border2);}
.date-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-family:var(--font-mono);font-size:10px;font-weight:500;white-space:nowrap;}
.dp-none{color:var(--muted2);}
.dp-2026{background:rgba(65,187,217,.12);color:#1A7D99;border:1px solid #ADCAD6;}
.dp-2027{background:rgba(30,158,106,.10);color:#1E9E6A;border:1px solid #bbf7d0;}
.dp-2028{background:rgba(4,63,117,.10);color:#043F75;border:1px solid #819FB9;}
.gantt-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-family:var(--font-mono);}
#gantt-wrap{min-height:200px;}
#editModeBtn.active{background:var(--retelit-blue);color:#fff;border-color:var(--retelit-blue);}
#gantt-wrap svg [data-row-id]{cursor:pointer;}
#gantt-wrap svg [data-row-id]:hover{filter:brightness(1.15) drop-shadow(0 0 2px var(--retelit-blue));}
#ganttEditPopover{position:fixed;z-index:9998;background:var(--surface);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow-lg);padding:14px 16px;width:240px;font-size:12px;display:none;}
#ganttEditPopover .gep-title{font-weight:700;font-size:11px;margin-bottom:10px;color:var(--text);}
#ganttEditPopover label{display:block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 0 3px;}
#ganttEditPopover input{width:100%;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:var(--font-body);}
#ganttEditPopover .gep-actions{display:flex;gap:6px;margin-top:12px;}
#ganttEditPopover .gep-actions button{flex:1;padding:6px 8px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;font-family:var(--font-body);}
#ganttEditPopover .gep-save{background:var(--retelit-blue)!important;color:#fff!important;border-color:var(--retelit-blue)!important;}
#ganttEditPopover .gep-reset{color:var(--danger);}
#ganttEditPopover .gep-err{color:var(--danger);font-size:10px;margin-top:6px;display:none;}
#ganttEditPopover select{width:100%;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:var(--font-body);background:var(--surface);color:var(--text);}
.gantt-dep{transition:opacity .12s ease,stroke-width .12s ease;}
.gantt-dep.dim{opacity:0.08!important;}
.gantt-dep.hi{opacity:1!important;stroke-width:2.2px!important;}
</style>
</head>

var GANTT_OVERRIDES = {}; /* row.id -> {pct,start,end,label,sub} */

async function fetchGanttOverrides() {
  try {
    var res = await fetch((window.ENRI && window.ENRI.isEnabled ? window.ENRI.apiBase : '') + '/api/gantt/overrides?lotto=' + encodeURIComponent(LOTTO_ID), {
      headers: { 'x-session-token': _sessionToken() }

  } catch (e) {

  }
}

function applyGanttOverrides() {
  GANTT_ROWS.forEach(function(row) {
    var ov = GANTT_OVERRIDES[String(row.id)];
    if (!ov) return;
    if (ov.pct !== undefined && ov.pct !== null) row.pct = ov.pct;
    if (ov.start) row.start = ov.start;
    if (ov.end) row.end = ov.end;
    if (ov.date) row.date = ov.date;
    if (ov.label) row.label = ov.label;
    if (ov.sub !== undefined) row.sub = ov.sub;
    if (ov.dep_pred !== undefined) {
      if (ov.dep_pred === '' || ov.dep_pred === null) {
        delete GANTT_DEPS[row.id];
      } else {
        GANTT_DEPS[row.id] = { pred: Number(ov.dep_pred), type: ov.dep_type || 'FS', lagDays: Number(ov.dep_lag) || 0 };
      }
    }
    row.manual = true;
    row.real = false; /* un override manuale non è più "dato reale Master.csv" */
  });
}

/* ── merge con Master.csv: sostituisce pct/data baseline delle milestone Fase 2
   (permessi) con lo stato reale caricato dall'impresa, match per ENTE + n.pratica.
   Stessa scala stati di index.html (riga ~2133, STATI) per coerenza col resto della dashboard. ── */
var STATI_ORDER = ['IN ATTESA','IN REDAZIONE','IN FIRMA RDS','INVIO PRELIMINARE','INVIATO','PROTOCOLLATO',
  'NECESSARIA INTEGRAZIONE','IN REDAZIONE INTEGRAZIONE','PROTOCOLLATO INTEGRAZIONE','OTTENUTO'];

function statoToPct(stato) {
  if (!stato) return null;
  var s = stato.trim().toUpperCase();
  if (s === 'NO COMPETENZA') return null; /* escluso dai conteggi, come da regola globale ENRI */
  var idx = STATI_ORDER.indexOf(s);
  if (idx === -1) return null;
  return Math.round((idx / (STATI_ORDER.length - 1)) * 100);
}

function parsePraticaFromLabel(label) {
  var m = label.match(/(AUT|NO)\/(\d+)\/1A/i);
  if (!m) return null;
  var pratica = m[2];
  var ente = label.slice(0, m.index).replace(/[-–]\s*$/, '').trim();
  return { ente: ente, pratica: pratica };
}

function splitCsvLine(line, sep) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') inQ = !inQ;
    else if (ch === sep && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  result.push(cur.trim());
  return result;
}

async function mergeMasterCsv() {
  try {
    var res = await fetch('Master.csv', { headers: { 'x-session-token': _sessionToken() } });
    if (!res.ok) return;
    var text = await res.text();
    var lines = text.trim().split('\n').map(function(l){ return l.replace(/\r/,''); });
    var sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
    var headers = splitCsvLine(lines[0], sep);
    function findCol(name) {
      for (var i = 0; i < headers.length; i++) if (headers[i].trim().toUpperCase() === name.toUpperCase()) return i;
      return -1;
    }
    var iSrc = findCol('Source.Name'), iEnte = findCol('ENTE'), iStato = findCol('STATO_PERMESSO'),
        iPrat = findCol('PRATICA'), iDum = findCol('DATA_ULTIMA_MODIFICA'), iDappr = findCol('DATA_APPROVAZIONE'),
        iDprev = findCol('DATA_PREVISTA_RILASCIO');
    if (iSrc === -1 || iPrat === -1) return;

    /* per (pratica, ente): tiene la riga con DATA_ULTIMA_MODIFICA più recente */
    var best = {};
    function parseDMY(s) {
      if (!s) return null;
      var p = s.trim().split('/');
      if (p.length !== 3) return null;
      return new Date(+p[2], +p[1]-1, +p[0]);
    }
    for (var i = 1; i < lines.length; i++) {
      var cols = splitCsvLine(lines[i], sep);
      var src = (cols[iSrc] || '').trim().toUpperCase();
      if (src !== 'LOTTO 1A.XLSX') continue;
      var prat = (cols[iPrat] || '').trim();
      var ente = iEnte !== -1 ? (cols[iEnte] || '').trim().toUpperCase() : '';
      if (!prat) continue;
      var key = prat + '|' + ente;
      var dum = iDum !== -1 ? parseDMY(cols[iDum]) : null;
      if (!best[key] || (dum && (!best[key]._dum || dum > best[key]._dum))) {
        best[key] = {
          stato: iStato !== -1 ? cols[iStato] : '',
          dappr: iDappr !== -1 ? cols[iDappr] : '',
          dprev: iDprev !== -1 ? cols[iDprev] : '',
          _dum: dum
        };
      }
    }

    GANTT_ROWS.forEach(function(row) {
      if (row.t !== 'ms') return;
      var parsed = parsePraticaFromLabel(row.label);
      if (!parsed) return;
      /* match tollerante: ENTE Master.csv può non coincidere al 100% col testo del .mpp (es. RFI/AIPO/SATAP brevi) */
      var matchKey = null;
      for (var k in best) {
        var kp = k.split('|')[0], kEnte = k.split('|')[1];
        if (kp === parsed.pratica && (kEnte.indexOf(parsed.ente.toUpperCase()) !== -1 || parsed.ente.toUpperCase().indexOf(kEnte) !== -1)) {
          matchKey = k; break;
        }
      }
      if (!matchKey) return;
      var rec = best[matchKey];
      var pct = statoToPct(rec.stato);
      if (pct === null) return;
      row.pct = pct;
      row.real = true;
      var newDate = (pct === 100 && rec.dappr) ? rec.dappr : (rec.dprev || null);
      if (newDate) row.date = newDate.trim();
    });
  } catch (e) {
    console.warn('Master.csv non caricato per il gantt:', e.message);
  }
}

/* ── merge con /api/cantieri: aggiorna le barre "Opere Civili" (Fase 5, una
   per comune) con l'avanzamento reale inserito dalle imprese di scavi in
   scavi.html/imprese_scavi.html/mappa_impresa_caricamento.html. Stessa
   convenzione di scavi.html per la %: metri_scavati/metri_totali sommati su
   tutti i cantieri del comune (un lotto ha più cantieri, uno per pratica).
   Le date del cantiere sono ISO (input type=date) mentre il Gantt usa
   gg/mm/aaaa → conversione con isoToDmy(). Un override manuale (§ sopra)
   vince sempre anche su questo merge, applicato dopo in applyGanttOverrides(). ── */
function isoToDmy(iso) {
  if (!iso) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return null;
  return m[3] + '/' + m[2] + '/' + m[1];
}

function parseComuneFromGanttLabel(label) {
  /* label Fase 5 ora per-ente/permesso, es. "9 · COMUNE DI PERO - AUT/13/1A":
     estrae il nome comune ovunque nella label, non solo a fine stringa (rev.176).
     Per enti non-comunali (AIPO, RFI, SATAP, ecc.) non matcha: nessun merge cantieri,
     restano a baseline — coerente, i cantieri sono tracciati solo per comune. */
  var m = /COMUNE DI\s+([^\-]+)/i.exec(label);
  return m ? m[1].trim().toUpperCase() : null;
}

async function mergeCantieriProgress() {
  try {
    var res = await fetch((window.ENRI && window.ENRI.isEnabled ? window.ENRI.apiBase : '') + '/api/cantieri?lotto=' + encodeURIComponent(LOTTO_ID), {
      headers: { 'x-session-token': _sessionToken() }
    });
    if (!res.ok) return;
    var data = await res.json();
    var cantieri = data.cantieri || [];
    if (!cantieri.length) return; /* nessun cantiere ancora sincronizzato per questo lotto: baseline invariata */

    /* raggruppa per comune */
    var byComune = {};
    cantieri.forEach(function(c) {
      var comune = (c.comune || '').trim().toUpperCase();
      if (!comune) return;
      if (!byComune[comune]) byComune[comune] = { metriTot: 0, metriScavati: 0, iniziEff: [], fineEff: [], iniziPrev: [], finePrev: [] };
      var g = byComune[comune];
      g.metriTot += Number(c.metri_totali || 0);
      g.metriScavati += Number(c.metri_scavati || 0);
      if (c.data_inizio_effettiva) g.iniziEff.push(c.data_inizio_effettiva);
      if (c.data_fine_effettiva) g.fineEff.push(c.data_fine_effettiva);
      if (c.data_inizio_prevista) g.iniziPrev.push(c.data_inizio_prevista);
      if (c.data_fine_prevista) g.finePrev.push(c.data_fine_prevista);
    });

    GANTT_ROWS.forEach(function(row) {
      if (row.t !== 'bar') return;
      var comune = parseComuneFromGanttLabel(row.label);
      if (!comune || !byComune[comune]) return;
      var g = byComune[comune];
      if (g.metriTot > 0) {
        row.pct = Math.round((g.metriScavati / g.metriTot) * 100);
        row.real = true;
      }
      /* inizio: preferisce l'effettiva (più affidabile), poi la prevista più vecchia */
      var iniziISO = g.iniziEff.length ? g.iniziEff : g.iniziPrev;
      var fineISO = g.fineEff.length ? g.fineEff : g.finePrev;
      if (iniziISO.length) {
        var minIso = iniziISO.slice().sort()[0];
        var dmy = isoToDmy(minIso);
        if (dmy) row.start = dmy;
      }
      if (fineISO.length) {
        var maxIso = fineISO.slice().sort().slice(-1)[0];
        var dmy2 = isoToDmy(maxIso);
        if (dmy2) row.end = dmy2;
      }
    });
  } catch (e) {
    console.warn('Avanzamento cantieri non caricato per il gantt:', e.message);
  }
}

/* ── KPI header ── */
function buildKpi() {
  var wrap = document.getElementById('kpiRow');
  var bars = GANTT_ROWS.filter(function(r){ return r.t === 'bar'; });
  var ms = GANTT_ROWS.filter(function(r){ return r.t === 'ms'; });
  var topBar = bars[0]; /* Fase 1, rappresentativo dell'avanzamento aggregato non e' disponibile: usiamo pct medio pesato sulle fasi con bar */
  var avgPct = Math.round(bars.reduce(function(s,r){return s+r.pct;},0) / bars.length);
  var msDone = ms.filter(function(r){ return r.pct >= 100; }).length;
  var todayD = new Date(2026,6,7);
  var msOverdue = ms.filter(function(r){ var d = parseDateStr(r.date); return d && d < todayD && r.pct < 100; }).length;
  var lastFinish = bars.reduce(function(mx,r){ var d = parseDateStr(r.end); return (d && d > mx) ? d : mx; }, new Date(2026,0,1));
  var lastFinishStr = ('0'+lastFinish.getDate()).slice(-2)+'/'+('0'+(lastFinish.getMonth()+1)).slice(-2)+'/'+lastFinish.getFullYear();
  wrap.innerHTML =
    '<div class="legend-chip chip-2026">Avanzamento medio fasi: ' + avgPct + '%</div>' +
    '<div class="legend-chip chip-2026">Permessi ottenuti: ' + msDone + '/' + ms.length + '</div>' +
    '<div class="legend-chip' + (msOverdue > 0 ? ' chip-overdue' : ' chip-2026') + '">Scadenze superate: ' + msOverdue + '</div>' +
    '<div class="legend-chip chip-2026">Fine prevista: ' + lastFinishStr + '</div>';
}

/* ── Gantt render ── */
function _groupRowCount(groupId) {
  var idx = GANTT_ROWS.findIndex(function(r) { return r.id === groupId; });
  if (idx === -1) return 0;
  var n = 0;
  for (var i = idx + 1; i < GANTT_ROWS.length && GANTT_ROWS[i].t !== 'g'; i++) n++;
  return n;
}

function buildGantt() {
  var wrap = document.getElementById('gantt-wrap');
  if (!wrap) return;

  var containerW = wrap.parentElement ? wrap.parentElement.getBoundingClientRect().width : 0;
  var W = Math.max(860, containerW > 40 ? containerW - 40 : 860);

  var LW = 250;   /* label column width — nomi enti/comuni piu' lunghi */
  var RH = 30;    /* row height */
  var GH = 24;    /* group header height */
  var HDR = 50;   /* time axis header height (+10 per la riga anno sopra i mesi) */

  var T0 = new Date(2026, 1, 1);   /* 01/02/2026 */
  var T1 = new Date(2027, 0, 15);  /* 15/01/2027 — padding fine anno */
  var SPAN = T1 - T0;
  var CW = W - LW;

  function xPos(dateStr) {
    var d = parseDateStr(dateStr);
    if (!d) return null;
    var ratio = (d - T0) / SPAN;
    ratio = Math.max(0, Math.min(1, ratio));
    return LW + ratio * CW;
  }

  /* palette blu monocromatica (brand kit ENRI-RDS) */
  var C_DARK = '#043F75';    /* --retelit-blue */
  var C_MID  = '#436A93';    /* --retelit-blue-75 */
  var C_LIGHT= '#819FB9';    /* --retelit-blue-50 */
  var C_PALE = '#C0CFDC';    /* --retelit-blue-25 */
  var C_GRAY = '#9AA5B4';    /* --gray-400 */

  var totalH = HDR;
  (function() {
    var collapsed = false;
    GANTT_ROWS.forEach(function(r) {
      if (r.t === 'g') { totalH += GH; collapsed = COLLAPSED_GROUPS.has(r.id); return; }
      if (!collapsed) totalH += RH;
    });
  })();

  var parts = [];
  parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + totalH + '" style="display:block;font-family:Raleway,sans-serif;">');
  parts.push('<rect width="' + W + '" height="' + totalH + '" fill="#F7F8FA"/>');

  /* griglia mensile */
  var months = ['01/02/2026','01/03/2026','01/04/2026','01/05/2026','01/06/2026','01/07/2026','01/08/2026','01/09/2026','01/10/2026','01/11/2026','01/12/2026','01/01/2027'];
  var mLabels = ['FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC','GEN'];
  months.forEach(function(mDate, i) {
    var mx = xPos(mDate);
    if (mx === null) return;
    parts.push('<line x1="' + mx + '" y1="' + HDR + '" x2="' + mx + '" y2="' + totalH + '" stroke="#DFE4EB" stroke-width="0.6" stroke-dasharray="3,3"/>');
    parts.push('<text x="' + (mx + 4) + '" y="' + (HDR - 6) + '" font-size="9" font-family="JetBrains Mono,monospace" font-weight="600" fill="' + C_MID + '">' + mLabels[i] + '</text>');
  });
  /* anno di riferimento, sopra i mesi: raggruppa i mesi consecutivi dello stesso
     anno e centra l'etichetta sull'intervallo (qui: 2026 su FEB-DIC, 2027 solo su GEN). */
  var yearGroups = [];
  months.forEach(function(mDate) {
    var mx = xPos(mDate);
    if (mx === null) return;
    var yr = mDate.split('/')[2];
    if (!yearGroups.length || yearGroups[yearGroups.length - 1].year !== yr) {
      yearGroups.push({ year: yr, x1: mx });
    }
  });
  yearGroups.forEach(function(yg, i) {
    yg.x2 = (i + 1 < yearGroups.length) ? yearGroups[i + 1].x1 : W;
  });
  yearGroups.forEach(function(yg, i) {
    if (i > 0) parts.push('<line x1="' + yg.x1 + '" y1="4" x2="' + yg.x1 + '" y2="' + (HDR-16) + '" stroke="#C4CDD8" stroke-width="0.8"/>');
    parts.push('<text x="' + ((yg.x1 + yg.x2) / 2) + '" y="17" font-size="10" font-family="JetBrains Mono,monospace" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="' + C_DARK + '">' + yg.year + '</text>');
  });
  parts.push('<line x1="0" y1="' + HDR + '" x2="' + W + '" y2="' + HDR + '" stroke="#C4CDD8" stroke-width="1.5"/>');
  parts.push('<rect x="0" y="0" width="' + LW + '" height="' + totalH + '" fill="#EEF1F5"/>');
  parts.push('<line x1="' + LW + '" y1="0" x2="' + LW + '" y2="' + totalH + '" stroke="#C4CDD8" stroke-width="1"/>');

  /* oggi: 07/07/2026 */
  var todayX = xPos('07/07/2026');
  if (todayX !== null) {
    parts.push('<line x1="' + todayX + '" y1="' + HDR + '" x2="' + todayX + '" y2="' + totalH + '" stroke="var(--retelit-teal)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.9"/>');
    parts.push('<polygon points="' + (todayX-5) + ',' + HDR + ' ' + (todayX+5) + ',' + HDR + ' ' + todayX + ',' + (HDR+9) + '" fill="var(--retelit-teal)"/>');
  }

  var todayD = new Date(2026,6,7);
  var rowY = HDR;
  var groupCollapsed = false;
  var ROW_GEOM = {}; /* id riga -> {x1,x2,cy} — per disegnare i connettori di dipendenza */
  GANTT_ROWS.forEach(function(row, idx) {
    if (row.t === 'g') {
      groupCollapsed = COLLAPSED_GROUPS.has(row.id);
      parts.push('<rect x="0" y="' + rowY + '" width="' + W + '" height="' + GH + '" fill="#DFE4EB" data-group-id="' + row.id + '" style="cursor:pointer;"/>');
      var chevPts = groupCollapsed
        ? (10)+','+(rowY+GH/2-3)+' '+(16)+','+(rowY+GH/2)+' '+(10)+','+(rowY+GH/2+3)   /* ▸ chiusa */
        : (7)+','+(rowY+GH/2-2)+' '+(13)+','+(rowY+GH/2-2)+' '+(10)+','+(rowY+GH/2+3); /* ▾ aperta */
      parts.push('<polygon points="' + chevPts + '" fill="var(--gray-500)" data-group-id="' + row.id + '" style="cursor:pointer;"/>');
      parts.push('<text x="24" y="' + (rowY + GH/2 + 3) + '" font-size="8" font-family="JetBrains Mono,monospace" font-weight="700" fill="var(--gray-500)" letter-spacing="1.5" data-group-id="' + row.id + '" style="cursor:pointer;">' + row.label + (groupCollapsed ? '  (' + _groupRowCount(row.id) + ' task nascosti)' : '') + '</text>');
      rowY += GH;
      return;
    }
    if (groupCollapsed) return;

    var cy = rowY + RH / 2;
    if (idx % 2 === 0) {
      parts.push('<rect x="' + (LW+1) + '" y="' + rowY + '" width="' + (CW-1) + '" height="' + RH + '" fill="rgba(4,63,117,0.013)"/>');
    }
    parts.push('<line x1="0" y1="' + (rowY + RH) + '" x2="' + W + '" y2="' + (rowY + RH) + '" stroke="#DFE4EB" stroke-width="0.5"/>');
    parts.push('<text x="10" y="' + (cy + 3) + '" font-size="9.5" font-family="Raleway,sans-serif" font-weight="600" fill="var(--gray-700)">' + row.label + '</text>');

    if (row.t === 'bar') {
      var x1 = xPos(row.start);
      var x2 = xPos(row.end);
      if (x1 !== null && x2 !== null) {
        var w = Math.max(x2 - x1, 3);
        var tip = row.label + ' — ' + row.start + ' \u2192 ' + row.end + ' (' + fmtIt(row.pct) + '%)' + (row.sub ? (' | ' + row.sub) : '');
        /* traccia (outline) */
        parts.push('<rect x="' + x1 + '" y="' + (cy-7) + '" width="' + w + '" height="14" rx="7" fill="' + C_PALE + '" opacity="0.35" stroke="' + C_LIGHT + '" stroke-width="1.2" data-tip="' + tip.replace(/"/g,'&quot;') + '" data-row-id="' + row.id + '"/>');
        /* fill % completamento */
        var fillW = w * (row.pct/100);
        if (fillW > 0) {
          parts.push('<rect x="' + x1 + '" y="' + (cy-7) + '" width="' + fillW + '" height="14" rx="7" fill="' + C_DARK + '" opacity="0.85" style="pointer-events:none;"/>');
        }
        var pctLabelLeft = ganttHasFsDepartureFromEnd(row.id);
        var pctX = pctLabelLeft ? (x1 - 6) : (x2 + 6);
        parts.push('<text x="' + pctX + '" y="' + (cy+3.5) + '" font-size="8.5" font-family="JetBrains Mono,monospace" font-weight="600"' + (pctLabelLeft ? ' text-anchor="end"' : '') + ' fill="' + (row.pct >= 100 ? C_DARK : C_GRAY) + '" style="pointer-events:none;">' + fmtIt(row.pct) + '%</text>');
        ROW_GEOM[row.id] = { x1: x1, x2: x2, cy: cy };
      }
    } else if (row.t === 'ms') {
      var mx = xPos(row.date);
      if (mx !== null) {
        var done = row.pct >= 100;
        var overdue = !done && parseDateStr(row.date) && parseDateStr(row.date) < todayD;
        var fill = done ? C_DARK : (overdue ? C_MID : C_LIGHT);
        var tipMs = row.label + ' — scadenza ' + row.date + (done ? ' (ottenuto)' : (overdue ? ' (scaduta, non ottenuta)' : ' (in corso)'));
        parts.push('<polygon points="' + mx + ',' + (cy-7) + ' ' + (mx+7) + ',' + cy + ' ' + mx + ',' + (cy+7) + ' ' + (mx-7) + ',' + cy + '" fill="' + fill + '" stroke="' + C_DARK + '" stroke-width="' + (overdue?1.5:(row.real?1:0)) + '" data-tip="' + tipMs.replace(/"/g,'&quot;') + '" data-row-id="' + row.id + '"/>');
        parts.push('<text x="' + (mx + 11) + '" y="' + (cy+3) + '" font-size="8" font-family="JetBrains Mono,monospace" fill="var(--gray-500)" style="pointer-events:none;">' + row.date + ' · ' + fmtIt(Math.round(row.pct)) + '%</text>');
        ROW_GEOM[row.id] = { x1: mx, x2: mx, cy: cy };
      }
    }

    rowY += RH;
  });

  /* connettori di dipendenza (predecessore → successore): disegnati solo se
     entrambe le righe sono attualmente visibili (nessuna delle due dentro una
     fase collassata) — vedi GANTT_DEPS in cima allo script.
     Curve bezier (non più gomiti retti): con predecessori condivisi (es. le 3
     "Consegna materiali" da "Richiesta forniture") i gomiti retti si
     sovrapponevano/incrociavano rendendo illeggibile quale linea andasse dove;
     la curva morbida separa visivamente i percorsi anche quando condividono
     lo stesso punto di partenza. Class .gantt-dep + data-dep-pred/data-dep-succ
     abilitano l'highlight on-hover (vedi listener mousemove sotto: hover su un
     task evidenzia solo le sue dipendenze, le altre si attenuano). */
  Object.keys(GANTT_DEPS).forEach(function(succId) {
    succId = +succId;
    var dep = GANTT_DEPS[succId];
    var g1 = ROW_GEOM[dep.pred], g2 = ROW_GEOM[succId];
    if (!g1 || !g2) return;
    var startX = dep.type === 'SS' ? g1.x1 : g1.x2;
    var startY = g1.cy, endX = g2.x1, endY = g2.cy;
    var dx = Math.max(24, (endX - startX) * 0.45);
    var c1x = startX + dx, c2x = (endX - 6) - dx;
    var stroke = dep.approx ? 'var(--gray-400)' : 'var(--retelit-teal)';
    var dash = dep.approx ? 'stroke-dasharray="2,3"' : '';
    var depAttrs = 'class="gantt-dep" data-dep-pred="' + dep.pred + '" data-dep-succ="' + succId + '"';
    var d = 'M ' + startX + ' ' + startY + ' C ' + c1x + ' ' + startY + ' ' + c2x + ' ' + endY + ' ' + (endX - 6) + ' ' + endY;
    parts.push('<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="1.3" ' + dash + ' opacity="0.55" ' + depAttrs + ' style="pointer-events:none;"/>');
    parts.push('<polygon points="' + (endX-6) + ',' + (endY-3) + ' ' + endX + ',' + endY + ' ' + (endX-6) + ',' + (endY+3) + '" fill="' + stroke + '" opacity="0.7" ' + depAttrs + ' style="pointer-events:none;"/>');
  });

  parts.push('</svg>');
  wrap.innerHTML = parts.join('');

  var svg = wrap.querySelector('svg');
  if (svg) {
    var _lastHoverRow = null;
    svg.addEventListener('mousemove', function(e) {
      var tip = e.target.getAttribute('data-tip');
      if (tip) {
        _tt.textContent = tip;
        _tt.style.display = 'block';
        _tt.style.left = (e.clientX + 14) + 'px';
        _tt.style.top  = (e.clientY - 28) + 'px';
      } else {
        _tt.style.display = 'none';
      }
      var rowEl = e.target.closest && e.target.closest('[data-row-id]');
      var hoverId = rowEl ? rowEl.getAttribute('data-row-id') : null;
      if (hoverId !== _lastHoverRow) {
        _lastHoverRow = hoverId;
        _applyGanttDepHighlight(svg, hoverId);
      }
    });
    svg.addEventListener('mouseleave', function() {
      _tt.style.display = 'none';
      _lastHoverRow = null;
      _applyGanttDepHighlight(svg, null);
    });
    svg.addEventListener('click', function(e) {
      var gid = e.target.getAttribute('data-group-id');
      if (gid !== null) {
        gid = +gid;
        if (COLLAPSED_GROUPS.has(gid)) COLLAPSED_GROUPS.delete(gid); else COLLAPSED_GROUPS.add(gid);
        buildGantt();
        return;
      }
      var rid = e.target.getAttribute('data-row-id');
      if (rid === null) return;
      if (EDIT_MODE) {
        openGanttEditPopover(+rid, e.clientX, e.clientY);
      } else {
        openGanttDepsPopover(+rid, e.clientX, e.clientY);
      }
    });
  }
}

/* ── modalità modifica (solo admin/admin2): consente di editare a mano ogni
   campo di ogni riga, indipendentemente dagli invii impresa. ── */
var EDIT_MODE = false;
var COLLAPSED_GROUPS = new Set(); /* id delle righe 'g' (fase) attualmente collassate */

function toggleEditMode() {
  EDIT_MODE = !EDIT_MODE;
  document.getElementById('editModeBtn').classList.toggle('active', EDIT_MODE);
  document.getElementById('editModeBtnLabel').textContent = EDIT_MODE ? 'Modifica attiva' : 'Modalità modifica';
  document.getElementById('gantt-wrap').classList.toggle('edit-on', EDIT_MODE);
  if (!EDIT_MODE) closeGanttEditPopover();
}

function _applyGanttDepHighlight(svg, hoverId) {
  var els = svg.querySelectorAll('.gantt-dep');
  els.forEach(function(el) {
    if (hoverId === null) { el.classList.remove('dim'); el.classList.remove('hi'); return; }
    var related = el.getAttribute('data-dep-pred') === hoverId || el.getAttribute('data-dep-succ') === hoverId;
    el.classList.toggle('hi', related);
    el.classList.toggle('dim', !related);
  });
}

function findGanttRow(rowId) {
  return GANTT_ROWS.filter(function(r) { return r.id === rowId; })[0];
}

function ganttDepsHtml(rowId) {
  var pred = GANTT_DEPS[rowId];
  var succIds = ganttSuccessorsOf(rowId);
  if (!pred && !succIds.length) return '<div style="font-size:10.5px;color:var(--muted);margin-top:8px;">Nessuna dipendenza nota per questo task.</div>';
  var html = '<div style="margin-top:10px;border-top:1px solid var(--border2);padding-top:8px;">';
  if (pred) {
    var pr = findGanttRow(pred.pred);
    html += '<div style="font-size:9.5px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:2px;">Prima (predecessore)</div>' +
      '<div style="font-size:11px;">' + (pr ? pr.label.replace(/</g,'&lt;') : '?') + '</div>' +
      '<div style="font-size:9px;color:var(--muted);">' + (pred.type === 'SS' ? 'Inizio→Inizio' : 'Fine→Inizio') + (pred.lagDays ? (' · +' + pred.lagDays + 'g') : '') + (pred.approx ? ' · dato approssimato (vedi nota)' : '') + '</div>';
  }
  if (succIds.length) {
    html += '<div style="font-size:9.5px;font-weight:600;text-transform:uppercase;color:var(--muted);margin:8px 0 2px;">Dopo (successori)</div>';
    succIds.forEach(function(sid) {
      var sr = findGanttRow(sid);
      var d = GANTT_DEPS[sid];
      html += '<div style="font-size:11px;">' + (sr ? sr.label.replace(/</g,'&lt;') : '?') + '</div>' +
        '<div style="font-size:9px;color:var(--muted);">' + (d.type === 'SS' ? 'Inizio→Inizio' : 'Fine→Inizio') + (d.lagDays ? (' · +' + d.lagDays + 'g') : '') + '</div>';
    });
  }
  html += '</div>';
  return html;
}

function ganttDepsEditHtml(rowId) {
  var cur = GANTT_DEPS[rowId];
  var options = '<option value="">— nessuna —</option>' + GANTT_ROWS.filter(function(r) {
    return r.t !== 'g' && r.id !== rowId;
  }).map(function(r) {
    var sel = cur && cur.pred === r.id ? ' selected' : '';
    return '<option value="' + r.id + '"' + sel + '>' + r.label.replace(/</g, '&lt;').slice(0, 42) + '</option>';
  }).join('');
  var succIds = ganttSuccessorsOf(rowId);
  var succHtml = '';
  if (succIds.length) {
    succHtml = '<div style="font-size:9.5px;font-weight:600;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;">Dopo (successori)</div>';
    succIds.forEach(function(sid) {
      var sr = findGanttRow(sid);
      succHtml += '<div style="font-size:11px;">' + (sr ? sr.label.replace(/</g, '&lt;') : '?') + '</div>';
    });
    succHtml += '<div style="font-size:9px;color:var(--muted);margin-top:2px;">Modificabili dal popover di ciascun successore.</div>';
  }
  return '<div style="margin-top:10px;border-top:1px solid var(--border2);padding-top:8px;">' +
    '<label>Predecessore</label><select id="gepDepPred">' + options + '</select>' +
    '<label>Tipo relazione</label><select id="gepDepType">' +
      '<option value="FS"' + (!cur || cur.type === 'FS' ? ' selected' : '') + '>Fine→Inizio (FS)</option>' +
      '<option value="SS"' + (cur && cur.type === 'SS' ? ' selected' : '') + '>Inizio→Inizio (SS)</option>' +
    '</select>' +
    '<label>Ritardo (giorni)</label><input id="gepDepLag" type="number" min="0" value="' + (cur && cur.lagDays ? cur.lagDays : 0) + '">' +
    succHtml +
  '</div>';
}

function openGanttDepsPopover(rowId, clientX, clientY) {
  var row = findGanttRow(rowId);
  if (!row) return;
  var pop = document.getElementById('ganttEditPopover');
  pop.innerHTML =
    '<div class="gep-title">' + row.label.replace(/</g,'&lt;') + '</div>' +
    ganttDepsHtml(rowId) +
    '<div class="gep-actions"><button onclick="closeGanttEditPopover()">Chiudi</button></div>';
  pop.style.display = 'block';
  _positionGanttPopover(pop, clientX, clientY);
}

function _positionGanttPopover(pop, clientX, clientY) {
  var pw = 240, ph = pop.getBoundingClientRect().height || 220;
  var left = Math.min(clientX + 12, window.innerWidth - pw - 12);
  var top = Math.min(clientY + 12, window.innerHeight - ph - 12);
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}

function openGanttEditPopover(rowId, clientX, clientY) {
  var row = findGanttRow(rowId);
  if (!row) return;
  var pop = document.getElementById('ganttEditPopover');
  var isBar = row.t === 'bar';
  var dateFields = isBar
    ? '<label>Data inizio</label><input id="gepStart" value="' + (row.start||'') + '" placeholder="gg/mm/aaaa">' +
      '<label>Data fine</label><input id="gepEnd" value="' + (row.end||'') + '" placeholder="gg/mm/aaaa">'
    : '<label>Data</label><input id="gepDate" value="' + (row.date||'') + '" placeholder="gg/mm/aaaa">';
  pop.innerHTML =
    '<div class="gep-title">' + row.label.replace(/</g,'&lt;') + '</div>' +
    '<label>% completamento</label><input id="gepPct" type="number" min="0" max="100" value="' + Math.round(row.pct) + '">' +
    dateFields +
    (isBar ? '<label>Note</label><input id="gepSub" value="' + (row.sub||'').replace(/"/g,'&quot;') + '">' : '') +
    (row.manual ? '<div style="font-size:9.5px;color:var(--muted);margin-top:8px;">✓ valore manuale salvato</div>' : '') +
    ganttDepsEditHtml(rowId) +
    '<div class="gep-err" id="gepErr"></div>' +
    '<div class="gep-actions">' +
      '<button class="gep-save" onclick="saveGanttEdit(' + rowId + ')">Salva</button>' +
      (row.manual ? '<button class="gep-reset" onclick="resetGanttEdit(' + rowId + ')">Ripristina</button>' : '') +
      '<button onclick="closeGanttEditPopover()">Annulla</button>' +
    '</div>';
  pop.style.display = 'block';
  _positionGanttPopover(pop, clientX, clientY);
}

function closeGanttEditPopover() {
  document.getElementById('ganttEditPopover').style.display = 'none';
}

async function saveGanttEdit(rowId) {
  var row = findGanttRow(rowId);
  var errEl = document.getElementById('gepErr');
  errEl.style.display = 'none';
  var fields = { pct: document.getElementById('gepPct').value };
  if (row.t === 'bar') {
    fields.start = document.getElementById('gepStart').value.trim();
    fields.end = document.getElementById('gepEnd').value.trim();
    fields.sub = document.getElementById('gepSub').value.trim();
  } else {
    fields.date = document.getElementById('gepDate').value.trim();
  }
  fields.dep_pred = document.getElementById('gepDepPred').value;
  fields.dep_type = document.getElementById('gepDepType').value;
  fields.dep_lag = document.getElementById('gepDepLag').value;
  if (fields.dep_pred !== '' && Number(fields.dep_pred) === rowId) {
    errEl.textContent = 'Un task non può dipendere da se stesso';
    errEl.style.display = 'block';
    return;
  }
  try {
    await saveGanttOverride(rowId, fields);
    GANTT_OVERRIDES[String(rowId)] = fields;
    applyGanttOverrides();
    buildKpi();
    buildGantt();
    closeGanttEditPopover();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function resetGanttEdit(rowId) {
  try {
    await resetGanttOverride(rowId);
    closeGanttEditPopover();
    location.reload(); /* modo più semplice/robusto per ricalcolare baseline + Master.csv senza tenerne copia in memoria */
  } catch (e) {
    var errEl = document.getElementById('gepErr');
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

var _tt = document.createElement('div');
_tt.id = 'gantt-tooltip';
_tt.style.cssText = 'position:fixed;pointer-events:none;display:none;background:var(--gray-700);color:#fff;font-family:JetBrains Mono,monospace;font-size:11px;padding:5px 10px;border-radius:6px;white-space:nowrap;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.25);';
document.body.appendChild(_tt);
window.addEventListener('load', function() {
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      buildKpi();
      buildGantt();
      Promise.all([mergeMasterCsv(), mergeCantieriProgress(), fetchGanttOverrides()]).then(function() {
        applyGanttOverrides(); /* vince sempre su baseline + Master.csv */
        buildKpi();
        buildGantt();
      });
    });
  });
});
window.addEventListener('resize', function() {
  clearTimeout(window._ganttTimer);
  window._ganttTimer = setTimeout(buildGantt, 80);
});
if (IS_ADMIN) document.getElementById('editModeBtn').style.display = 'inline-flex';
document.addEventListener('click', function(e) {
  var pop = document.getElementById('ganttEditPopover');
  if (pop.style.display === 'block' && !pop.contains(e.target) && !e.target.closest('[data-row-id]')) {
    closeGanttEditPopover();
  }
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeGanttEditPopover(); });
</script>
